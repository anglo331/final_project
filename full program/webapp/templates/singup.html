{% extends "base.html" %} {% block title %} sing_up {% endblock %} {% block
body%}
<div class=" m-3"></div>
<div class="d-flex">
<div class="login-box align-content-center container mb-5" style="background-color: rgb(240, 235, 238); width:400px; border-radius: 25px;
padding-top:35px;">
    <h2 class="center" style="text-align:center"><b>Create Account</b></h2>
    <form method="POST">
        <div class="form-group" style="width: 350px;margin-left:4%;">
            <label for="exampleInputuserName"><b>User Name</b></label>
            <input
                type="User Name"
                class="form-control"
                id="exampleInputuserName"
                name="user name"
                aria-describedby="user nameHelp"
                placeholder="Enter user name"
            />
        </div>

        <div class="form-group" style="width: 350px;margin-left:4%;">
            <label for="exampleInputPassword1"><b>Email</b></label>
            <input
                type="Email"
                class="form-control"
                name="Email"
                id="exampleInputemail"
                placeholder="Enter Email"
            />

        </div>
        <div class="form-group" style="width: 350px;margin-left:4%;">
            <label for="exampleInputPassword1"><b> Password</b></label>
            <input
                type="Password"
                class="form-control"
                name="Password"
                id="exampleInputPassword1"
                placeholder="Password"
            />
        </div>
        <div class="form-group" style="width: 350px;margin-left:4%;">
            <label for="exampleInputConfirmPassword"><b>Confirm Password</b></label>
            <input
                type="password"
                class="form-control"
                id="exampleInputConfirmPassword"
                name="confirm password"
                aria-describedby="confirmPasswordHelp"
                placeholder="Enter confirm password"
            >
        </div>
        
        <button type="submit" class="btn btn-primary ms-2 mb-2">Submit</button>
    </form>
</div>
</div>
{%endblock%}
