{% extends "base.html" %} {% block title%} login {%endblock%} {%block body%}
<div class=" m-3"></div>
<div class="d-flex">
<div class="login-box container" style="background-color: rgb(240, 235, 238); width:400px;height: 400px; border-radius: 25px; 
  padding-top:35px;">
    <h2 class="center" style="text-align:center"><b>Login</b></h2>
      <form method="POST">
        <div class="form-group" style="width: 350px;margin-left:4%;">
          <label for="exampleInputEmail1"><b>Email address</b></label>
          <input type="email" 
          class="form-control" 
          id="exampleInputEmail1"
          name="email"
          aria-describedby="emailHelp" 
          placeholder="Enter email">

          <small id="emailHelp" class="form-text text-muted">We'll never share your email with anyone else.</small>
        </div>
        <div class="form-group"  style="width: 350px;margin-left:4%;">
          <label for="exampleInputPassword1"><b>Password</b></label>
          <input type="password"
          class="form-control"
          name="password" 
          id="exampleInputPassword1" 
          placeholder="Password">

        </div>
        <div class="form-group form-check;" style="margin-left:4%">
          <input type="checkbox" class="form-check-input" id="exampleCheck1">
          <label class="form-check-label" for="exampleCheck1">Check me out</label>
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
  </form>
</div>
</div>
</div>
{%endblock%}
